# =====================================================================
# SLWF-01 Pro v2.1  --  ETAPE 9.9 : ATTENTE DE LA TEMPERATURE AVANT LE RESYNC BOOT
# =====================================================================
# ETAPE 9.9 (04/11/2026) -- changements vs 9.8 :
#   on_boot (-100) : wait_until current_temperature connue (timeout 60 s,
#   la sequence continue apres) AVANT le if de 9.8. Le 04/11 la query a boot
#   + 20 s avec temperature inconnue (1ere temp a +31,8 s) laissait l'etat
#   en heat_cool ; la meme query avec temperature connue donne heat en
#   < 0,3 s. Le log indique aussi temp=. Une seule query, aucun interval.
#   Cartographie DP : inchangee.
#
# --- Entete etape 9.8 ---
# =====================================================================
# SLWF-01 Pro v2.1  --  ETAPE 9.8 : RESYNC BOOT AUSSI SI MODE HEAT_COOL
# =====================================================================
# ETAPE 9.8 (04/11/2026) -- changements vs 9.7 :
#   on_boot (-100) : le resync_mcu unique de 9.7 se declenche aussi si le
#   mode climate vaut HEAT_COOL a boot + 20 s (DP4 pas encore traite : le
#   climate affiche heat_cool au lieu de heat). Toujours UNE query, puis
#   5 s avant le filet. Aucun interval. Cartographie DP : inchangee.
#
# --- Entete etape 9.7 ---
# =====================================================================
# SLWF-01 Pro v2.1  --  ETAPE 9.7 : RESYNC UNIQUE AU BOOT SI CONSIGNE NaN
# =====================================================================
# ETAPE 9.7 (04/11/2026) -- changements vs 9.6 :
#   on_boot (-100) : a boot + 20 s, SEULEMENT si target_temperature est NaN,
#   un resync_mcu unique (query 0x08) puis 5 s d'attente AVANT le filet de
#   consigne, pour que la valeur annoncee par le MCU prime sur
#   saved_target_temp. Consigne connue = aucune query. Pas de repetition.
#   Cartographie DP : inchangee.
#
# --- Entete etape 9.6 ---
# =====================================================================
# SLWF-01 Pro v2.1  --  ETAPE 9.6 : INTERRUPTEUR AFFICHAGE (DP13)
# =====================================================================
# ETAPE 9.6 (30/10/2026) -- changements vs 9.5 :
#   1. Nouveau switch tuya « Affichage » (switch_datapoint 13) : allume /
#      eteint la LED de l'afficheur de l'unite interieure.
#      DP13 est WRITE-ONLY : le MCU ne renvoie jamais son etat. HA garde
#      donc la derniere commande envoyee, qui peut etre FAUSSE si
#      l'afficheur est change a la telecommande. Pas de resync possible.
#      Aucun envoi au MCU au boot (une ecriture = un bip) : le switch
#      tuya n'ecrit rien dans setup() ni via restore (le composant
#      n'appelle jamais Switch::restore) ; restore_mode: DISABLED est
#      pose par precaution (aucune restauration, aucune sauvegarde flash).
#      L'etat reste « inconnu » dans HA jusqu'a la 1ere commande.
#   Cartographie : ajout de DP13 (voir ci-dessous). Reste inchange.
#
# --- Entete etape 9.5 ---
# =====================================================================
# SLWF-01 Pro v2.1  --  ETAPE 9.5 : DEBORDEMENT DP3 + CAPTURE UART RX
# =====================================================================
# ETAPE 9.5 (30/10/2026) -- changements vs 9.4 :
#   A COMPILER AVEC ESPHome >= 2026.10.1 : la PR #18519 remplace l'ISR RX
#   bloquante de l'UART logicielle ESP8266 par un decodeur « edge »
#   (jusqu'a 19200 bauds). Cause probable des checksums 55!=xx et des
#   Software Watchdog des etapes precedentes (9.4 compilee en 2026.9.1).
#   1. Correction du debordement uint8 de DP3 : le MCU Airton envoie
#      l'ambiante (x10) modulo 256 au-dela de 25,5 C (26,0 C -> brut 4,
#      26,5 C -> 9...). Les « DP3 aberrantes brut=4 » sont de vraies
#      mesures. Regle appliquee a la source, avant la plausibilite :
#      si brut < 70 (< 7,0 C) alors brut += 256.
#        - tuya on_datapoint_update (DP3) : valeur corrigee pour la
#          plausibilite et les compteurs « DP3 aberrantes * » (une valeur
#          corrigee n'est plus aberrante) ; log ESP_LOGI 1 / 60 s.
#        - « Temperature salon » : 1er filtre = meme correction (avant
#          multiply 0.1) ; c'est elle qui alimente le climate.
#        - Le capteur « DP3 brut » et dp3_last_raw restent NON corriges
#          (diagnostic). Nouveau compteur « DP3 corrigees (+256) » (total
#          depuis le boot, global dp3_fixed_total).
#        - Le climate n'a pas de current_temperature_datapoint (voir 9.1) :
#          il recoit deja la valeur filtree de « Temperature salon », donc
#          la valeur corrigee. Rien d'autre a faire.
#   2. Capture UART RX activable : uart: debug (direction RX, trame
#      terminee apres 20 ms de silence) logue les octets en hexa
#      (tag uart_debug, DEBUG) seulement si le global uart_debug_on est
#      vrai, pilote par le switch « Capture UART » (diagnostic, toujours
#      OFF au boot). Logger global passe en DEBUG, composants bavards
#      remis en INFO (logger: logs). Les WARN tuya (checksum) restent
#      visibles. A remettre en INFO global une fois l'enquete close.
#   Inchange : power_save none, rx_buffer_size 512, pas de query 0x08
#   automatique, bouton Resynchroniser, boite noire RTC, baud_rate 0.
#
# --- Entete etape 9.4 ---
# =====================================================================
# SLWF-01 Pro v2.1  --  ETAPE 9.4 : FIN DES QUERIES 0x08 AUTO + WIFI/UART
# =====================================================================
# ETAPE 9.4 (30/10/2026) -- changements vs 9.3 :
#   1. WiFi : output_power 10dB retire (defaut), power_save_mode: none.
#      Raison : power_save LIGHT soupconne de faire perdre des octets au
#      SoftwareSerial (reboots r=4 precedes d'un flood UART de trames
#      corrompues : DP3=4, checksum 55!=xx).
#   2. Plus aucune query Tuya 0x08 automatique (boot + interval 15 min
#      supprimes ; resync_mcu reste en manuel via le bouton). Raison : le
#      2e reboot des paires a ~60 s = 2e query 0x08 du boot.
#   3. Log watchdog DP3 limite a 1 ESP_LOGW / 60 s (cumul de trames +
#      derniere brute). Raison : log par trame trop couteux pendant un
#      flood (jusqu'a 260/min). Compteurs et capteurs DP3 inchanges.
#   4. UART rx_buffer_size 1024 -> 512 (RAM, meme flood).
#
# --- Entete etape 9.3 ---
# =====================================================================
# SLWF-01 Pro v2.1  --  ETAPE 9.3 : BOITE NOIRE RTC + MEMOIRE ALLEGEE
# =====================================================================
# Clim AIRTON salon, TuyaMCU. Product : pjnywabwywopufvb
#
# Cartographie acquise :
#   DP1  switch  marche/arret
#   DP2  int     consigne, en DIXIEMES de degre (270 = 27,0 C)
#   DP3  int     temperature ambiante, en DIXIEMES (230 = 23,0 C)
#   DP4  enum    mode      0=auto 1=froid 2=deshu 3=CHAUD 4=VENTIL
#   DP5  enum    ventil    0=auto 1a5=vitesses 6=silencieux 7=turbo
#   DP13 switch  afficheur LED unite interieure (WRITE-ONLY, etat jamais renvoye)
#   DP20 bitmask codes defaut
#   DP106/107    drapeaux lies au mode (basculent avec DP4)
#
# Changement vs etape 7 :
#   Le watchdog DP3 redemarrait l'ESP apres 15 min SANS valeur DP3.
#   Or le MCU cesse d'emettre DP3 quand la clim est a l'arret (ou temp
#   stable) -> reboot toutes les ~16 min -> bip a chaque reboot.
#   Desormais le watchdog ne reagit qu'a une DESYNC averee (valeurs DP3
#   brutes implausibles consecutives), jamais au silence, avec un
#   plafond de reboots consecutifs.
#
# Changement vs etape 8 :
#   Apres un reboot de l'ESP, le statut initial du MCU arrive parfois
#   incomplet ou corrompu (11/10 14:18 : climate "off", selects Mode et
#   Vitesse "unknown"). Le MCU n'emet ensuite que sur changement, et la
#   trame DP1 d'un allumage a la telecommande peut aussi se perdre
#   (11/10 15:38 : DP110 recu, DP1/DP4 jamais). HA reste alors faux
#   indefiniment.
#   Desormais l'ESP envoie la requete Tuya "query DP status" (cmd 0x08),
#   en lecture seule donc sans bip : 15 s et 60 s apres le boot, puis
#   toutes les 5 min, et via un bouton "Resynchroniser". Le MCU repond
#   avec l'etat de tous les DP. Le filet de securite sur la consigne
#   passe APRES la premiere resync pour ne pas ecraser une valeur valide
#   qui n'etait simplement pas encore arrivee.
#
# Etape 9.1 (logs du 11/10 16:12-17:12) :
#   - Chaque reponse de statut ramene la consigne a 2.10 C : le MCU y
#     envoie DP2 en degres entiers. Correction locale x10 (voir tuya:).
#   - Le thermostat n'avait pas de temperature courante (0.00 / null) :
#     on lui pousse la sonde filtree "Temperature salon".
#
# ETAPE 9.2 (reboots en boucle) :
#   POURQUOI : l'ESP redemarre 10 a 12 fois/jour (cause "Software/System
#   restart"). Le seul restart applicatif est le watchdog DP3, et des
#   rafales de reboots a ~40 s d'uptime montrent que la clim envoie des
#   flots de DP3 aberrants. On veut OBSERVER sans redemarrer.
#   QUOI :
#     - Le watchdog DP3 n'appelle plus btn_restart (plus de plafond ni de
#       global dp3_wd_restarts) : il ne fait que compter et logger.
#     - Capteurs de diagnostic "DP3 ..." exposes a HA (30 s).
#     - Logs tuya en DEBUG, TEMPORAIRE (niveau global DEBUG, les autres
#       composants bavards sont remis en INFO).
#   COMMENT LIRE LES CAPTEURS :
#     - "DP3 brut" : derniere valeur DP3 recue (dixiemes), aberrante ou non.
#     - "DP3 aberrantes consecutives" : serie en cours (0 = tout va bien).
#     - "DP3 aberrantes total" : cumul depuis le boot.
#     - "DP3 aberrantes apres query" : aberrantes arrivees < 2 s apres
#       l'envoi de la query 0x08 (hypothese : la reponse de resync est en
#       cause). "DP3 aberrantes spontanees" : toutes les autres.
#       Si apres_query ~ total -> resync coupable ; si spontanees ->
#       c'est la clim qui emet des DP3 corrompus d'elle-meme.
#     - "DP3 derniere aberrante brute" : valeur brute de la derniere.
#     - "DP3 age derniere trame" : secondes depuis la derniere trame DP3
#       (vide si aucune recue depuis le boot).
#   A RETIRER ENSUITE : les capteurs et globals dp3_* si l'enquete est
#   close, et le bloc logger "TEMPORAIRE 9.2" (niveau global a remettre
#   en INFO, tag tuya en WARN).
#
# Etape 9.2 en bref : le watchdog DP3 ne redemarre plus rien (observation
# seule), compteurs/capteurs "DP3 ..." exposes a HA, logs tuya en DEBUG
# (temporaire). Resultat du check du 22/10 : l'ESP redemarre toujours
# 10-11 fois/jour, donc le watchdog DP3 n'est PAS la cause.
#
# ETAPE 9.3 (boite noire + memoire) :
#   POURQUOI : cause "Software/System restart" 10-11 fois/jour, rafales de
#   3-4 reboots a ~1 min d'intervalle, 4 "Software Watchdog" pendant un flot
#   UART. Heap libre 20-35 k, plus gros bloc libre jusqu'a 11,6 k seulement.
#   Sur ESP8266 un abort() ou un echec d'allocation (OOM) remonte aussi en
#   "Software/System restart" ; les reboot_timeout par defaut (15 min) de
#   wifi et api sont l'autre suspect. Pas de logs serie (baud_rate 0, l'UART
#   sert au Tuya) ni de syslog : il faut une boite noire.
#   QUOI :
#     - Boite noire en RTC : un interval 1 s ecrit dans des globals
#       restore_value (RTC, pas de flash) l'etat de l'ESP ; au boot suivant
#       ils sont recopies dans des globals prev_* puis remis a zero.
#     - Capteurs "Avant reboot : ..." (diagnostic) + "Reset detail".
#     - Memoire allegee : logger INFO, AP de secours + captive_portal
#       retires, DP inutiles retires (liste plus bas).
#     - Resync periodique 5 min -> 15 min (voir "Le 2" plus bas).
#   COMMENT LIRE LA BOITE NOIRE (valeurs = celles juste AVANT le reboot) :
#     - "Avant reboot : uptime" : duree de vie du boot precedent (s). Des
#       uptimes de ~40-60 s en rafale = boucle de reboots.
#     - "Avant reboot : derniere API OK" / "dernier WiFi OK" : uptime de la
#       derniere seconde ou api/wifi etaient connectes. Si l'ecart avec
#       "uptime" est ~900 s -> reboot_timeout (15 min sans API ou sans
#       WiFi). Si ecart ~0 -> ce n'est pas un timeout reseau.
#     - "Avant reboot : heap min" / "bloc min" : minima depuis le boot
#       precedent. Heap < ~8 k ou bloc < ~2 k -> OOM probable.
#     - "Avant reboot : boucle max" : pire "Loop time" (fenetres de 60 s,
#       capteur debug) ; > ~1000 ms -> blocage de boucle / Software Watchdog.
#     - "Avant reboot : DP3 aberrantes" : dp3_bad_total du boot precedent
#       (flot UART aberrant juste avant le reboot ?).
#     - "Reset detail" : "r=<reason> exc=<exccause> epc1=0x<pc>" lu dans
#       ESP.getResetInfoPtr(). reason 2 = exception (exc/epc1 utiles),
#       3 = soft WDT, 4 = soft restart (restart() ou abort), 1 = hard WDT.
#     - Apres une coupure secteur la RTC est perdue : prev_* = 0, c'est normal.
#   RETIRE EN 9.3 (non identifies / inutiles) :
#     - wifi: ap: et captive_portal: (AP de secours "slwf-sniffer")
#     - tuya sensors  : DP21, DP22, DP101, DP102, DP103, DP104, DP105,
#                       DP112, DP113, DP114
#     - tuya binary_sensors : DP8, DP12, DP108, DP109, DP111, DP115
#     - bloc logger TEMPORAIRE 9.2 (tuya DEBUG etc.)
#     GARDES : DP20 (defauts), DP106, DP107, DP110 (a servi a reperer un
#     allumage a la telecommande).
#   LE "2" : le climate publie d'abord 2.1 (DP2 en degres entiers dans les
#   statuts complets) avant que la correction 9.1 (delay 200 ms) le
#   remplace : HA voit "2" pendant 0,2 s a chaque query de resync. On
#   espace donc la resync periodique (15 min) : moins de statuts complets,
#   donc moins de "2" transitoires. Resync au boot inchangee.
#
# Le nom du device reste "slwf-sniffer" pour conserver les IDs d'entites.
# =====================================================================

substitutions:
  name: "slwf-sniffer"
  friendly_name: "Clim salon"

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  on_boot:
    # Boite noire (etape 9.3) : priorite HAUTE, avant que l'interval 1 s ne
    # reecrive les bb_*. Les globals restore_value sont restaures en
    # setup (priorite > 500) : on recopie l'etat du boot precedent dans les
    # prev_*, puis on remet les bb_* a leur etat initial.
    - priority: 500
      then:
        - lambda: |-
            id(prev_uptime_s) = id(bb_uptime_s);
            id(prev_heap_min) = id(bb_heap_min);
            id(prev_block_min) = id(bb_block_min);
            id(prev_loop_max_ms) = id(bb_loop_max_ms);
            id(prev_api_last_ok_s) = id(bb_api_last_ok_s);
            id(prev_wifi_last_ok_s) = id(bb_wifi_last_ok_s);
            id(prev_dp3_bad_total) = id(bb_dp3_bad_total);
            id(bb_uptime_s) = 0;
            id(bb_heap_min) = (uint32_t) ESP.getFreeHeap();
            id(bb_block_min) = (uint32_t) ESP.getMaxFreeBlockSize();
            id(bb_loop_max_ms) = 0;
            id(bb_api_last_ok_s) = 0;
            id(bb_wifi_last_ok_s) = 0;
            id(bb_dp3_bad_total) = 0;

    # Priorite basse pour laisser le temps au MCU d'emettre son statut initial
    - priority: -100
      then:
        # Etape 9.4 : plus aucune query 0x08 automatique (manuel seulement)
        - delay: 20s
        # Etape 9.9 : on attend la 1ere temperature salon (max 60 s, puis on
        # continue quand meme : le cas consigne NaN reste couvert).
        - wait_until:
            condition:
              lambda: 'return !std::isnan(id(clim_thermostat).current_temperature);'
            timeout: 60s
        # Etape 9.7/9.8 : consigne encore NaN ou mode HEAT_COOL apres 20 s
        # (statut initial du MCU incomplet, cf. 04/11) -> UN SEUL resync_mcu, puis 5 s pour laisser
        # le climate traiter la reponse. Consigne connue : aucune query.
        - if:
            condition:
              lambda: 'return std::isnan(id(clim_thermostat).target_temperature) || id(clim_thermostat).mode == climate::CLIMATE_MODE_HEAT_COOL;'
            then:
              - logger.log:
                  level: WARN
                  tag: clim_boot
                  format: "Consigne NaN ou mode HEAT_COOL au boot -> resync_mcu unique (query 0x08) [consigne=%.1f mode=%d temp=%.1f]"
                  args: ['id(clim_thermostat).target_temperature', '(int) id(clim_thermostat).mode', 'id(clim_thermostat).current_temperature']
              - script.execute: resync_mcu
              - delay: 5s
        # Filet de securite au boot : si la consigne est absente (null/NaN) ou
        # corrompue (valeur < 16 C, comme le bug connu du 2), on retablit
        # la derniere consigne connue et valide.
        - lambda: |-
            if (std::isnan(id(clim_thermostat).target_temperature) || id(clim_thermostat).target_temperature < 16.0f) {
              ESP_LOGW("clim_boot", "Consigne absente ou < 16 C au boot -> restauration automatique a %.1f C", id(saved_target_temp));
              auto call = id(clim_thermostat).make_call();
              call.set_target_temperature(id(saved_target_temp));
              call.perform();
            }

    # Publication unique des capteurs "Avant reboot" et de "Reset detail"
    # (ensuite : toutes les 5 min via update_interval des capteurs).
    - priority: -200
      then:
        - delay: 20s
        - lambda: |-
            char buf[48];
            const struct rst_info *ri = ESP.getResetInfoPtr();
            snprintf(buf, sizeof(buf), "r=%u exc=%u epc1=0x%08x",
                     (unsigned int) ri->reason, (unsigned int) ri->exccause,
                     (unsigned int) ri->epc1);
            id(reset_detail).publish_state(buf);
        - component.update: prev_uptime_sensor
        - component.update: prev_heap_min_sensor
        - component.update: prev_block_min_sensor
        - component.update: prev_loop_max_sensor
        - component.update: prev_api_ok_sensor
        - component.update: prev_wifi_ok_sensor
        - component.update: prev_dp3_bad_sensor

esp8266:
  board: esp12e

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

api:

ota:
  - platform: esphome

logger:
  baud_rate: 0
  # Etape 9.5 : DEBUG global pour le tag uart_debug (capture RX) ; les
  # composants bavards en DEBUG sont remis en INFO. tuya reste a INFO :
  # ses WARN (checksum) restent visibles.
  level: DEBUG
  logs:
    dp3_watchdog: WARN
    clim_boot: WARN
    dp3_fix: INFO
    wifi: INFO
    api: INFO
    api.connection: INFO
    api.service: INFO
    mdns: INFO
    ota: INFO
    esphome.ota: INFO
    sensor: INFO
    text_sensor: INFO
    binary_sensor: INFO
    switch: INFO
    button: INFO
    select: INFO
    climate: INFO
    tuya: INFO
    component: INFO
    scheduler: INFO
    app: INFO
    debug: INFO
    preferences: INFO
    script: INFO
    template.sensor: INFO
    template.switch: INFO
    template.text_sensor: INFO
    wifi_signal.sensor: INFO
    uptime.sensor: INFO
    uart: INFO
    uart.arduino_esp8266: INFO
    uart.arduino_esp8266.sw: INFO
    globals: INFO
    interval: INFO

uart:
  id: ac_uart
  tx_pin: 12
  rx_pin: 14
  baud_rate: 9600
  rx_buffer_size: 512
  # Capture RX activable (etape 9.5) : une trame = octets jusqu'a 20 ms de
  # silence, logguee en hexa (tag uart_debug, DEBUG) si uart_debug_on.
  debug:
    direction: RX
    after:
      timeout: 20ms
    sequence:
      - lambda: |-
          if (id(uart_debug_on)) {
            uart::UARTDebug::log_hex(direction, bytes, ' ');
          }

tuya:
  id: tuya_ac
  # Watchdog DP3 (etape 9.2) : OBSERVATION SEULE, plus aucun restart.
  # Inspecte chaque trame DP3 BRUTE, avant les filtres (le median n'emet
  # qu'une valeur sur 15, inutilisable ici).
  on_datapoint_update:
    - sensor_datapoint: 3
      datapoint_type: int
      then:
        - lambda: |-
            uint32_t now = millis();
            // Brut NON corrige conserve pour le diagnostic ("DP3 brut")
            id(dp3_last_raw) = x;
            id(dp3_last_frame_ms) = now;
            // Debordement uint8 du MCU (etape 9.5) : brut < 70 (< 7,0 C)
            // -> +256, AVANT la plausibilite. Meme regle que le 1er filtre
            // de "Temperature salon" (le comptage n'est fait qu'ici).
            int xc = (int) x;
            if (xc < 70) {
              xc += 256;
              id(dp3_fixed_total)++;
              static uint32_t fix_last_ms = 0;
              static uint32_t fix_frames = 0;
              fix_frames++;
              if (fix_last_ms == 0 || (uint32_t) (now - fix_last_ms) >= 60000) {
                ESP_LOGI("dp3_fix", "DP3 corrigee (+256) : %u trames depuis le dernier log, derniere brute=%d -> %d (%.1f C)",
                         (unsigned int) fix_frames, (int) x, xc, xc * 0.1f);
                fix_last_ms = now;
                fix_frames = 0;
              }
            }
            float t = xc * 0.1f;
            if (t >= 5.0f && t <= 45.0f) {
              id(dp3_bad_count) = 0;
              return;
            }
            id(dp3_bad_count)++;
            id(dp3_bad_total)++;
            id(dp3_last_bad_raw) = x;
            // Hypothese resync : aberrante juste apres notre query 0x08 ?
            if (id(last_query_ms) != 0 && (uint32_t) (now - id(last_query_ms)) < 2000) {
              id(dp3_bad_after_query)++;
            } else {
              id(dp3_bad_spontaneous)++;
            }
            // Log limite (etape 9.4) : au plus 1 par 60 s, avec le cumul
            static uint32_t log_last_ms = 0;
            static uint32_t log_frames = 0;
            log_frames++;
            if (log_last_ms == 0 || (uint32_t) (now - log_last_ms) >= 60000) {
              ESP_LOGW("dp3_watchdog", "DP3 implausible : %u trames depuis le dernier log, derniere brute=%d (%.1f C)",
                       (unsigned int) log_frames, (int) x, t);
              log_last_ms = now;
              log_frames = 0;
            }

    # Correctif DP2 (etape 9.1) : dans ses reponses de statut complet (boot
    # et query 0x08), le MCU envoie la consigne en DEGRES ENTIERS (21),
    # alors que ses rapports de changement sont en DIXIEMES (210). Avec
    # temperature_multiplier 0.1 on obtient 2.1 C. C'est l'origine du
    # "consigne a 2 apres reboot" (#337), et non un glissement du parseur.
    # On attend que le climate ait traite la trame, puis on corrige
    # localement, sans rien ecrire au MCU (donc sans bip).
    - sensor_datapoint: 2
      datapoint_type: int
      then:
        - delay: 200ms
        - lambda: |-
            float t = id(clim_thermostat).target_temperature;
            if (std::isnan(t) || t >= 16.0f) return;
            float fixed = roundf(t * 10.0f);
            if (fixed < 16.0f || fixed > 31.0f) return;
            id(clim_thermostat).target_temperature = fixed;
            id(clim_thermostat).publish_state();

# =====================================================================
# GLOBALS
# =====================================================================
globals:
  # Trames DP3 brutes implausibles consecutives
  - id: dp3_bad_count
    type: int
    restore_value: no
    initial_value: '0'

  # Trames DP3 corrigees (+256, debordement uint8) depuis le boot (etape 9.5)
  - id: dp3_fixed_total
    type: int
    restore_value: no
    initial_value: '0'

  # Capture UART RX active (switch "Capture UART", etape 9.5)
  - id: uart_debug_on
    type: bool
    restore_value: no
    initial_value: 'false'

  # Derniere valeur DP3 brute recue, NON corrigee (dixiemes)
  - id: dp3_last_raw
    type: int
    restore_value: no
    initial_value: '0'

  # millis() de la derniere trame DP3 (0 = aucune depuis le boot)
  - id: dp3_last_frame_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  # Trames DP3 implausibles depuis le boot
  - id: dp3_bad_total
    type: int
    restore_value: no
    initial_value: '0'

  # Derniere valeur brute implausible
  - id: dp3_last_bad_raw
    type: int
    restore_value: no
    initial_value: '0'

  # Implausibles < 2 s apres une query 0x08 / spontanees
  - id: dp3_bad_after_query
    type: int
    restore_value: no
    initial_value: '0'

  - id: dp3_bad_spontaneous
    type: int
    restore_value: no
    initial_value: '0'

  # millis() du dernier envoi de la query 0x08 (0 = jamais)
  - id: last_query_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  # Derniere consigne valide. NB : sans `restore_from_flash: true` (bloc
  # esp8266), c'est en RTC et non en Flash : perdue sur coupure secteur.
  - id: saved_target_temp
    type: float
    restore_value: yes
    initial_value: '21.0'

  # Boite noire (etape 9.3) : RTC (restore_value: yes sans flash), ecrite
  # par l'interval 1 s. Remise a zero / recopiee dans prev_* au boot.
  - id: bb_uptime_s
    type: uint32_t
    restore_value: yes
    initial_value: '0'

  - id: bb_heap_min
    type: uint32_t
    restore_value: yes
    initial_value: '0'

  - id: bb_block_min
    type: uint32_t
    restore_value: yes
    initial_value: '0'

  - id: bb_loop_max_ms
    type: uint32_t
    restore_value: yes
    initial_value: '0'

  - id: bb_api_last_ok_s
    type: uint32_t
    restore_value: yes
    initial_value: '0'

  - id: bb_wifi_last_ok_s
    type: uint32_t
    restore_value: yes
    initial_value: '0'

  - id: bb_dp3_bad_total
    type: uint32_t
    restore_value: yes
    initial_value: '0'

  # Copies du boot precedent, non restaurees, exposees en capteurs
  - id: prev_uptime_s
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: prev_heap_min
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: prev_block_min
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: prev_loop_max_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: prev_api_last_ok_s
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: prev_wifi_last_ok_s
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: prev_dp3_bad_total
    type: uint32_t
    restore_value: no
    initial_value: '0'

debug:
  update_interval: 60s

# =====================================================================
# RESYNC : requete Tuya "query DP status"
#   55 AA | ver 00 | cmd 08 | len 00 00 | checksum 07
#   checksum = (0x55 + 0xAA + 0x08) & 0xFF = 0x07
# Lecture seule : le MCU repond avec tous les DP, rien n'est ecrit.
# =====================================================================
script:
  - id: resync_mcu
    mode: single
    then:
      - lambda: |-
          id(last_query_ms) = millis();
      - uart.write:
          id: ac_uart
          data: [0x55, 0xAA, 0x00, 0x08, 0x00, 0x00, 0x07]

button:
  - platform: restart
    name: "Redemarrer"
    id: btn_restart

  - platform: template
    name: "Resynchroniser"
    icon: mdi:sync
    on_press:
      - script.execute: resync_mcu

# =====================================================================
# INTERVALLES
# =====================================================================
interval:
  # Enregistre en continu la consigne valide lorsqu'elle change
  - interval: 10s
    then:
      - lambda: |-
          float cur_target = id(clim_thermostat).target_temperature;
          if (!std::isnan(cur_target) && cur_target >= 16.0f && cur_target <= 31.0f) {
            if (id(saved_target_temp) != cur_target) {
              id(saved_target_temp) = cur_target;
            }
          }

  # Boite noire (etape 9.3) : leger, sans std::string ni allocation
  - interval: 1s
    then:
      - lambda: |-
          id(bb_uptime_s) = (uint32_t) (millis() / 1000);
          uint32_t h = (uint32_t) ESP.getFreeHeap();
          if (h < id(bb_heap_min)) id(bb_heap_min) = h;
          uint32_t b = (uint32_t) ESP.getMaxFreeBlockSize();
          if (b < id(bb_block_min)) id(bb_block_min) = b;
          if (api::global_api_server->is_connected()) id(bb_api_last_ok_s) = id(bb_uptime_s);
          if (wifi::global_wifi_component->is_connected()) id(bb_wifi_last_ok_s) = id(bb_uptime_s);
          id(bb_dp3_bad_total) = (uint32_t) id(dp3_bad_total);

# =====================================================================
# THERMOSTAT COMPLET : CHAUD / FROID / VENTIL / DESHU + VENTILATION
# =====================================================================
climate:
  - platform: tuya
    id: clim_thermostat
    name: "Thermostat"
    switch_datapoint: 1
    target_temperature_datapoint: 2
    temperature_multiplier: 0.1
    supports_cool: true
    supports_heat: true
    visual:
      min_temperature: 16 °C
      max_temperature: 31 °C
      temperature_step: 1 °C
    # Mapping des modes natifs sur DP4
    active_state:
      datapoint: 4
      cooling_value: 1
      drying_value: 2
      heating_value: 3
      fanonly_value: 4
    # Mapping des vitesses de ventilation de base sur DP5
    fan_mode:
      datapoint: 5
      auto_value: 0
      low_value: 1
      medium_value: 3
      high_value: 5

# =====================================================================
# SELECTS : CONSERVES EN PARALLELE
# Assure la compatibilite totale avec les automatisations de compteurs
# et permet le reglage precis des 8 vitesses (Silencieux, Turbo...).
# =====================================================================
select:
  - platform: tuya
    name: "Mode"
    id: select_mode
    enum_datapoint: 4
    icon: mdi:air-conditioner
    options:
      0: Auto
      1: Froid
      2: Deshumidification
      3: Chaud
      4: Ventilation

  - platform: tuya
    name: "Vitesse ventilation"
    id: select_ventil
    enum_datapoint: 5
    icon: mdi:fan
    options:
      0: Auto
      1: Vitesse 1
      2: Vitesse 2
      3: Vitesse 3
      4: Vitesse 4
      5: Vitesse 5
      6: Silencieux
      7: Turbo

# =====================================================================
# CAPTEURS DIAGNOSTICS & DP DE LECTURE
# =====================================================================
sensor:
  - platform: wifi_signal
    name: "Wi-Fi Signal"
    update_interval: 60s

  - platform: uptime
    name: "Uptime"

  - platform: debug
    free:
      name: "Heap libre"
    block:
      name: "Plus gros bloc libre"
    loop_time:
      name: "Loop time"
      # Pire duree de boucle (fenetres de 60 s) pour la boite noire
      on_value:
        - lambda: |-
            uint32_t ms = (uint32_t) x;
            if (ms > id(bb_loop_max_ms)) id(bb_loop_max_ms) = ms;

  # Diagnostic watchdog DP3 (etape 9.2)
  - platform: template
    name: "DP3 brut"
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 30s
    lambda: |-
      return (float) id(dp3_last_raw);
  - platform: template
    name: "DP3 corrigees (+256)"
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 30s
    lambda: |-
      return (float) id(dp3_fixed_total);
  - platform: template
    name: "DP3 aberrantes consecutives"
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 30s
    lambda: |-
      return (float) id(dp3_bad_count);
  - platform: template
    name: "DP3 aberrantes total"
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 30s
    lambda: |-
      return (float) id(dp3_bad_total);
  - platform: template
    name: "DP3 aberrantes apres query"
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 30s
    lambda: |-
      return (float) id(dp3_bad_after_query);
  - platform: template
    name: "DP3 aberrantes spontanees"
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 30s
    lambda: |-
      return (float) id(dp3_bad_spontaneous);
  - platform: template
    name: "DP3 derniere aberrante brute"
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 30s
    lambda: |-
      return (float) id(dp3_last_bad_raw);
  - platform: template
    name: "DP3 age derniere trame"
    entity_category: diagnostic
    unit_of_measurement: "s"
    accuracy_decimals: 0
    update_interval: 30s
    lambda: |-
      if (id(dp3_last_frame_ms) == 0) return NAN;
      return (float) ((uint32_t) (millis() - id(dp3_last_frame_ms)) / 1000);

  # Boite noire (etape 9.3) : etat de l'ESP juste avant le reboot precedent
  - platform: template
    id: prev_uptime_sensor
    name: "Avant reboot : uptime"
    entity_category: diagnostic
    unit_of_measurement: "s"
    accuracy_decimals: 0
    update_interval: 5min
    lambda: |-
      return (float) id(prev_uptime_s);
  - platform: template
    id: prev_heap_min_sensor
    name: "Avant reboot : heap min"
    entity_category: diagnostic
    unit_of_measurement: "B"
    accuracy_decimals: 0
    update_interval: 5min
    lambda: |-
      return (float) id(prev_heap_min);
  - platform: template
    id: prev_block_min_sensor
    name: "Avant reboot : bloc min"
    entity_category: diagnostic
    unit_of_measurement: "B"
    accuracy_decimals: 0
    update_interval: 5min
    lambda: |-
      return (float) id(prev_block_min);
  - platform: template
    id: prev_loop_max_sensor
    name: "Avant reboot : boucle max"
    entity_category: diagnostic
    unit_of_measurement: "ms"
    accuracy_decimals: 0
    update_interval: 5min
    lambda: |-
      return (float) id(prev_loop_max_ms);
  - platform: template
    id: prev_api_ok_sensor
    name: "Avant reboot : derniere API OK"
    entity_category: diagnostic
    unit_of_measurement: "s"
    accuracy_decimals: 0
    update_interval: 5min
    lambda: |-
      return (float) id(prev_api_last_ok_s);
  - platform: template
    id: prev_wifi_ok_sensor
    name: "Avant reboot : dernier WiFi OK"
    entity_category: diagnostic
    unit_of_measurement: "s"
    accuracy_decimals: 0
    update_interval: 5min
    lambda: |-
      return (float) id(prev_wifi_last_ok_s);
  - platform: template
    id: prev_dp3_bad_sensor
    name: "Avant reboot : DP3 aberrantes"
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 5min
    lambda: |-
      return (float) id(prev_dp3_bad_total);

  # Sonde d'ambiance avec filtre anti-desync (etape 6)
  - platform: tuya
    name: "Temperature salon"
    id: temp_salon
    sensor_datapoint: 3
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      # Etape 9.5 : debordement uint8 du MCU (brut < 70 -> +256), avant tout
      - lambda: |-
          if (x < 70.0f) x += 256.0f;
          return x;
      - multiply: 0.1
      - lambda: |-
          if (x < 5.0 || x > 45.0) return {};   // desync -> drop
          return x;
      - median:
          window_size: 15
          send_every: 15
      - throttle_average: 30s
    # Temperature courante du thermostat (etape 9.1) : le climate n'a pas
    # de current_temperature_datapoint (il afficherait DP3 brut, sans le
    # filtre anti-desync), on lui pousse donc la valeur filtree (et, depuis
    # 9.5, corrigee du debordement).
    on_value:
      - lambda: |-
          id(clim_thermostat).current_temperature = x;
          id(clim_thermostat).publish_state();

  - platform: tuya
    name: "DP20 defauts"
    sensor_datapoint: 20
  - platform: tuya
    name: "DP106"
    sensor_datapoint: 106
  - platform: tuya
    name: "DP107"
    sensor_datapoint: 107

switch:
  # Etape 9.6 : afficheur (LED) de l'unite interieure. DP13 write-only.
  # restore_mode DISABLED : rien n'est restaure ni ecrit au boot (pas de bip).
  - platform: tuya
    name: "Affichage"
    switch_datapoint: 13
    icon: mdi:led-on
    restore_mode: DISABLED
  # Etape 9.5 : active la capture UART RX (uart: debug), OFF a chaque boot
  - platform: template
    name: "Capture UART"
    id: sw_uart_capture
    icon: mdi:serial-port
    entity_category: diagnostic
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - lambda: |-
          id(uart_debug_on) = true;
    turn_off_action:
      - lambda: |-
          id(uart_debug_on) = false;

text_sensor:
  - platform: debug
    reset_reason:
      name: "Cause du dernier reboot"
    device:
      name: "Infos device"

  # Etape 9.3 : reason / exccause / epc1 du dernier reset (publie au boot)
  - platform: template
    id: reset_detail
    name: "Reset detail"
    entity_category: diagnostic

binary_sensor:
  - platform: tuya
    name: "DP110"
    sensor_datapoint: 110
