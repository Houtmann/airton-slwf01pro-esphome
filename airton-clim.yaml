# =====================================================================
# Climatiseur AIRTON (TuyaMCU) piloté par un SMLIGHT SLWF-01 Pro v2.1
# reflashé sous ESPHome.
#
# Matériel  : SLWF-01 Pro v2.1 (ESP8266, board esp12e)
# Liaison   : UART logiciel, GPIO12 (TX) / GPIO14 (RX), 9600 bauds
# Protocole : TuyaMCU (trames 55 AA ...)
#
# Les identifiants Wi-Fi vivent dans secrets.yaml — voir
# secrets.yaml.example. Ne les écrivez jamais en clair ici.
# =====================================================================

substitutions:
  name: "clim-salon"
  friendly_name: "Clim salon"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp8266:
  board: esp12e

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Point d'accès de secours si le Wi-Fi est injoignable : évite d'avoir
  # à démonter la clé pour la reconfigurer.
  ap:
    ssid: "${name}-secours"
    password: !secret ap_password

captive_portal:

# Interface web du module : http://clim-salon.local
web_server:
  port: 80

api:

ota:
  - platform: esphome

# ---------------------------------------------------------------------
# baud_rate: 0 est OBLIGATOIRE.
# Sans cela le logger écrit sur le port série matériel et pollue le bus
# de la climatisation. Les logs passent par le Wi-Fi.
# ---------------------------------------------------------------------
logger:
  baud_rate: 0
  level: INFO

uart:
  id: ac_uart
  tx_pin: GPIO12
  rx_pin: GPIO14
  baud_rate: 9600
  # ---------------------------------------------------------------------
  # rx_buffer_size: 1024 — LE réglage à ne pas oublier sur ESP8266.
  #
  # GPIO12/14 ne sont pas les broches de l'UART matériel : ESPHome bascule
  # donc en *software serial*. La carte de la clim émet des dizaines de
  # trames par seconde ; avec le tampon par défaut (256 octets) il déborde
  # et l'on perd des octets au milieu d'une trame. Le décodeur se
  # désynchronise alors et lit des valeurs fantômes — par exemple 14 au
  # lieu de 270, dont l'encodage 00 00 01 0E amputé de son 01 donne 0E.
  #
  # Sur un ESP32 avec UART matériel, ce réglage est inutile.
  # ---------------------------------------------------------------------
  rx_buffer_size: 1024

tuya:
  id: tuya_ac

# =====================================================================
# THERMOSTAT
#
# temperature_multiplier: 0.1 — consigne ET mesure sont exprimées en
# dixièmes de degré (240 = 24,0 °C). Attention : ESPHome refuse
# target_temperature_multiplier employé seul, il exige alors aussi
# current_temperature_multiplier. Cette clé unique couvre les deux.
#
# current_temperature_datapoint est DÉLIBÉRÉMENT ABSENT : voir la section
# « I FEEL » du README. La température de la pièce est exposée plus bas
# par un capteur filtré.
# =====================================================================
climate:
  - platform: tuya
    id: clim
    name: "Thermostat"
    switch_datapoint: 1
    target_temperature_datapoint: 2
    temperature_multiplier: 0.1
    supports_cool: true
    supports_heat: true
    # Permet à Home Assistant d'afficher l'action réelle (chauffe, refroidit,
    # déshumidifie, ventile) au lieu d'un mode figé.
    active_state:
      datapoint: 4
      cooling_value: 1
      drying_value: 2
      heating_value: 3
      fanonly_value: 4
    # Rattrapage : la carte renvoie parfois une consigne non multipliée
    # (23 au lieu de 230), typiquement juste après un redémarrage.
    on_state:
      - lambda: |-
          if (x.target_temperature < 10) {
            id(clim).target_temperature = x.target_temperature * 10;
          }
    visual:
      min_temperature: 16 °C
      max_temperature: 31 °C
      temperature_step: 1 °C

# =====================================================================
# SÉLECTEURS
# =====================================================================
select:
  # ATTENTION à l'ordre : 3 = chaud et 4 = ventilation, soit l'INVERSE
  # du mapping Tuya le plus répandu. Vérifié sur le matériel.
  - platform: tuya
    name: "Mode"
    enum_datapoint: 4
    icon: mdi:air-conditioner
    options:
      0: Auto
      1: Froid
      2: Déshumidification
      3: Chaud
      4: Ventilation

  - platform: tuya
    name: "Vitesse ventilation"
    enum_datapoint: 5
    icon: mdi:fan
    options:
      0: Auto
      1: Vitesse 1
      2: Vitesse 2
      3: Vitesse 3
      4: Vitesse 4
      5: Vitesse 5
      6: Silencieux
      7: Turbo

  - platform: tuya
    name: "Oscillation verticale"
    enum_datapoint: 107
    icon: mdi:arrow-up-down
    options:
      0: Désactivée
      1: Activée
      2: Position 1
      3: Position 2
      4: Position 3
      5: Position 4
      6: Position 5

  - platform: tuya
    name: "Oscillation horizontale"
    enum_datapoint: 106
    icon: mdi:arrow-left-right
    options:
      0: Désactivée
      1: Activée

  - platform: tuya
    name: "Unité"
    enum_datapoint: 105
    icon: mdi:temperature-celsius
    options:
      0: "°C"
      1: "°F"

# =====================================================================
# INTERRUPTEURS
# =====================================================================
switch:
  - platform: tuya
    name: "Mode nuit"
    switch_datapoint: 109
    icon: mdi:weather-night

  - platform: tuya
    name: "Purificateur"
    switch_datapoint: 110
    icon: mdi:air-filter

  # DP13 est WRITE-ONLY : la carte exécute la commande mais ne renvoie
  # jamais son état, ni au démarrage ni ensuite. ESPHome conserve donc
  # la dernière valeur connue, qui peut différer de la réalité si vous
  # utilisez la télécommande. C'est normal, ce n'est pas un bug.
  - platform: tuya
    name: "Affichage"
    switch_datapoint: 13
    icon: mdi:led-on

# =====================================================================
# CAPTEURS
# =====================================================================
sensor:
  # LA température de la pièce.
  #   multiply 0.1         dixièmes de degré  -> °C
  #   median               absorbe l'alternance entre les deux sondes
  #   throttle_average 30s une valeur par 30 s au lieu de ~20 par seconde
  # Sans ces filtres, ce seul capteur suffit à saturer la base recorder
  # de Home Assistant. Voir la section « I FEEL » du README.
  - platform: tuya
    name: "Température pièce"
    sensor_datapoint: 3
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
      - median:
          window_size: 15
          send_every: 15
      - throttle_average: 30s

  # Codes défaut de la climatisation. 0 = aucun défaut.
  - platform: tuya
    name: "Défauts"
    sensor_datapoint: 20
    icon: mdi:alert-circle-outline
    entity_category: diagnostic

  - platform: wifi_signal
    name: "Signal Wi-Fi"
    update_interval: 60s
    entity_category: diagnostic
