# =====================================================================
# ÉTAPE 1 — SNIFFER UART BRUT
#
# But : savoir si la carte de la climatisation émet quoi que ce soit,
# et dans quel protocole. Ne pilote rien, écoute tout.
#
# À flasher, observer, puis remplacer par l'étape 2.
#
# Lecture du résultat :
#   55 AA ...     -> TuyaMCU        (poursuivre avec 02-tuya-discovery)
#   AA xx AC ...  -> Midea          (le firmware d'usine convenait)
#   rien du tout  -> bus muet, problème physique : mauvais port USB,
#                    module mal enfoncé, ou broches non câblées
#
# Nuance importante : une carte Tuya émet SPONTANÉMENT (vous verrez du
# trafic sans rien faire), là où une carte Midea ne répond que si on
# l'interroge. D'où les deux boutons de sonde ci-dessous.
# =====================================================================

substitutions:
  name: "clim-sniffer"

esphome:
  name: ${name}

esp8266:
  board: esp12e

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${name}-secours"
    password: !secret ap_password

captive_portal:

web_server:
  port: 80

api:

ota:
  - platform: esphome

logger:
  baud_rate: 0
  level: DEBUG

uart:
  id: ac_uart
  tx_pin: GPIO12
  rx_pin: GPIO14
  baud_rate: 9600
  rx_buffer_size: 1024
  debug:
    direction: BOTH
    dummy_receiver: true
    after:
      timeout: 30ms
    sequence:
      - lambda: UARTDebug::log_hex(direction, bytes, ' ');

# ---------------------------------------------------------------------
# Sondes actives, à déclencher depuis Home Assistant ou la page web du
# module si l'écoute passive ne donne rien.
# ---------------------------------------------------------------------
button:
  # Heartbeat TuyaMCU. Une carte Tuya y répond obligatoirement.
  - platform: template
    name: "Sonde Tuya (heartbeat)"
    on_press:
      - uart.write:
          id: ac_uart
          data: [0x55, 0xAA, 0x00, 0x00, 0x00, 0x00, 0xFF]

  # Requête d'informations produit TuyaMCU (commande 0x01).
  - platform: template
    name: "Sonde Tuya (infos produit)"
    on_press:
      - uart.write:
          id: ac_uart
          data: [0x55, 0xAA, 0x00, 0x01, 0x00, 0x00, 0x00]

sensor:
  - platform: wifi_signal
    name: "Signal Wi-Fi"
    update_interval: 30s
